<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Herramienta de Ofuscación - Supabase</title>
<style>
body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0d47a1, #1565c0); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
.container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 90%; }
h1 { color: #0d47a1; margin: 0 0 8px; font-size: 1.5rem; }
p { color: #666; margin: 0 0 24px; font-size: 0.9rem; }
label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 0.85rem; }
input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 0.9rem; margin-bottom: 16px; box-sizing: border-box; transition: border-color 0.2s; }
input:focus { outline: none; border-color: #1565c0; }
button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0d47a1, #1565c0); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
button:hover { transform: translateY(-2px); }
.result { background: #f5f5f5; padding: 16px; border-radius: 10px; margin-top: 20px; display: none; }
.result.show { display: block; }
.result label { color: #1565c0; }
.result code { display: block; background: #263238; color: #aed581; padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.8rem; word-break: break-all; margin-top: 8px; }
.warning { background: #fff3e0; border-left: 4px solid #ff9800; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.85rem; color: #e65100; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h1>🔐 Ofuscador de Credenciales Supabase</h1>
  <p>Ingrese sus credenciales para generar el código ofuscado.</p>

  <div class="warning">
    ⚠️ Esta herramienta funciona 100% en el navegador. No se envía ningún dato a servidores externos.
  </div>

  <label>URL de Supabase</label>
  <input type="text" id="url-input" placeholder="https://tu-proyecto.supabase.co">

  <label>Anon Key de Supabase</label>
  <input type="text" id="key-input" placeholder="eyJhbGciOiJIUzI1NiIs...">

  <button onclick="generarOfuscado()">Generar Código Ofuscado</button>

  <div class="result" id="resultado">
    <label>Valor _e para SUPABASE_URL:</label>
    <code id="url-output"></code>

    <label style="margin-top:16px;">Valor _e para SUPABASE_ANON_KEY:</label>
    <code id="key-output"></code>

    <p style="font-size:0.8rem;color:#666;margin-top:16px;">
      Copie estos valores y reemplace las variables _e en el archivo index.html
    </p>
  </div>
</div>

<script>
function ofuscar(texto, clave) {
  var e = "";
  for(var i=0; i<texto.length; i++){
    e += String.fromCharCode(texto.charCodeAt(i) ^ clave.charCodeAt(i % clave.length));
  }
  return btoa(e);
}

function generarOfuscado() {
  var url = document.getElementById('url-input').value.trim();
  var key = document.getElementById('key-input').value.trim();
  var clave = "DRA_2024_SECURE";

  if(!url || !key) {
    alert('Ingrese ambas credenciales');
    return;
  }

  var urlOfuscada = ofuscar(url, clave);
  var keyOfuscada = ofuscar(key, clave);

  document.getElementById('url-output').textContent = urlOfuscada;
  document.getElementById('key-output').textContent = keyOfuscada;
  document.getElementById('resultado').classList.add('show');
}
</script>
</body>
</html>
