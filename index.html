<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Personal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Gestión de Personal</a>
    </div>
  </nav>

  <div class="container pb-5">
    
    <!-- BOTONES PRINCIPALES DE ACCIÓN -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPersonal">
        + Nuevo Personal
      </button>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalPostulados">
        + Nuevo Postulado
      </button>
      <button class="btn btn-warning text-white" data-bs-toggle="modal" data-bs-target="#modalCambios">
        + Registrar Cambio de Estatus
      </button>
    </div>

    <!-- SECCIONES DE TABLAS -->
    <div class="row g-4">
      <!-- Tabla Personal -->
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header bg-white font-weight-bold">
            <h5 class="mb-0">Listado de Personal</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped align-middle">
                <thead>
                  <tr>
                    <th>Cédula</th>
                    <th>Nombre y Apellido</th>
                    <th>Cargo</th>
                    <th>Estatus</th>
                  </tr>
                </thead>
                <tbody id="tablaPersonal">
                  <!-- Se llena dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla Postulados -->
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h5 class="mb-0">Postulados</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Observación</th>
                  </tr>
                </thead>
                <tbody id="tablaPostulados">
                  <!-- Se llena dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla Cambios de Estatus -->
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h5 class="mb-0">Historial de Cambios</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Cédula</th>
                    <th>Nuevo Estatus</th>
                    <th>Motivo</th>
                  </tr>
                </thead>
                <tbody id="tablaCambios">
                  <!-- Se llena dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- MODAL PERSONAL -->
  <!-- ========================================== -->
  <div class="modal fade" id="modalPersonal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Nuevo Personal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formPersonal">
            <div class="mb-3">
              <label for="personal_cedula" class="form-label">Cédula</label>
              <input type="text" class="form-control" id="personal_cedula" required>
            </div>
            <div class="mb-3">
              <label for="personal_nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="personal_nombre" required>
            </div>
            <div class="mb-3">
              <label for="personal_cargo" class="form-label">Cargo</label>
              <input type="text" class="form-control" id="personal_cargo" required>
            </div>
            <div class="mb-3">
              <label for="personal_estatus" class="form-label">Estatus Inicial</label>
              <select class="form-select" id="personal_estatus">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
                <option value="Permiso">Permiso</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <!-- CORRECCIÓN APLICADA: onclick="savePersonal()" -->
          <button type="button" class="btn btn-primary" onclick="savePersonal()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL POSTULADOS -->
  <!-- ========================================== -->
  <div class="modal fade" id="modalPostulados" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Postulado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formPostulados">
            <div class="mb-3">
              <label for="postulado_cedula" class="form-label">Cédula</label>
              <input type="text" class="form-control" id="postulado_cedula" required>
            </div>
            <div class="mb-3">
              <label for="postulado_nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="postulado_nombre" required>
            </div>
            <div class="mb-3">
              <label for="postulado_observacion" class="form-label">Observación / Perfil</label>
              <textarea class="form-control" id="postulado_observacion" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <!-- CORRECCIÓN APLICADA: onclick="savePostulado()" -->
          <button type="button" class="btn btn-success" onclick="savePostulado()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL CAMBIOS DE ESTATUS -->
  <!-- ========================================== -->
  <div class="modal fade" id="modalCambios" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Cambio de Estatus</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formCambios">
            <div class="mb-3">
              <label for="cambio_cedula" class="form-label">Cédula del Personal</label>
              <input type="text" class="form-control" id="cambio_cedula" required>
            </div>
            <div class="mb-3">
              <label for="cambio_estatus" class="form-label">Nuevo Estatus</label>
              <select class="form-select" id="cambio_estatus">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
                <option value="Vacaciones">Vacaciones</option>
                <option value="Reposo">Reposo</option>
                <option value="Jubilado">Jubilado</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="cambio_motivo" class="form-label">Motivo</label>
              <textarea class="form-control" id="cambio_motivo" rows="2" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <!-- CORRECCIÓN APLICADA: onclick="saveCambio()" -->
          <button type="button" class="btn btn-warning text-white" onclick="saveCambio()">Guardar</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LÓGICA DE JAVASCRIPT CON SUPABASE -->
  <script>
    // 1. CONFIGURACIÓN DE SUPABASE (Reemplaza con tus credenciales)
    const SUPABASE_URL = "https://urejsoupkqxeihnftony.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9tgMxa_RHzi66P5hmWR8ow_bziTwtVi";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicializar lectura de datos al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      loadPersonal();
      loadPostulados();
      loadCambios();
    });

    // ==========================================
    // FUNCION 1: GUARDAR PERSONAL
    // ==========================================
    async function savePersonal() {
      const cedula = document.getElementById('personal_cedula').value.trim();
      const nombre = document.getElementById('personal_nombre').value.trim();
      const cargo = document.getElementById('personal_cargo').value.trim();
      const estatus = document.getElementById('personal_estatus').value;

      if (!cedula || !nombre || !cargo) {
        alert('Por favor completa todos los campos obligatorios.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('personal')
        .insert([{ cedula, nombre, cargo, estatus }]);

      if (error) {
        console.error('Error al guardar personal:', error.message);
        alert('Error al guardar: ' + error.message);
      } else {
        alert('Personal registrado exitosamente.');
        document.getElementById('formPersonal').reset();
        
        // Cerrar modal
        const modalEl = document.getElementById('modalPersonal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();

        loadPersonal();
      }
    }

    // ==========================================
    // FUNCION 2: GUARDAR POSTULADO
    // ==========================================
    async function savePostulado() {
      const cedula = document.getElementById('postulado_cedula').value.trim();
      const nombre = document.getElementById('postulado_nombre').value.trim();
      const observacion = document.getElementById('postulado_observacion').value.trim();

      if (!cedula || !nombre) {
        alert('Por favor ingresa al menos cédula y nombre.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('postulados')
        .insert([{ cedula, nombre, observacion }]);

      if (error) {
        console.error('Error al guardar postulado:', error.message);
        alert('Error al guardar: ' + error.message);
      } else {
        alert('Postulado registrado exitosamente.');
        document.getElementById('formPostulados').reset();

        // Cerrar modal
        const modalEl = document.getElementById('modalPostulados');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();

        loadPostulados();
      }
    }

    // ==========================================
    // FUNCION 3: GUARDAR CAMBIO DE ESTATUS
    // ==========================================
    async function saveCambio() {
      const cedula = document.getElementById('cambio_cedula').value.trim();
      const nuevoEstatus = document.getElementById('cambio_estatus').value;
      const motivo = document.getElementById('cambio_motivo').value.trim();

      if (!cedula || !motivo) {
        alert('Por favor ingresa la cédula y el motivo del cambio.');
        return;
      }

      // 1. Registrar en la tabla historial de cambios
      const { data, error } = await supabaseClient
        .from('cambios_estatus')
        .insert([{ cedula, nuevo_estatus: nuevoEstatus, motivo }]);

      if (error) {
        console.error('Error al guardar cambio:', error.message);
        alert('Error al guardar cambio: ' + error.message);
        return;
      }

      // 2. Actualizar también el estatus en la tabla 'personal'
      await supabaseClient
        .from('personal')
        .update({ estatus: nuevoEstatus })
        .eq('cedula', cedula);

      alert('Cambio de estatus registrado y actualizado exitosamente.');
      document.getElementById('formCambios').reset();

      // Cerrar modal
      const modalEl = document.getElementById('modalCambios');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      loadCambios();
      loadPersonal();
    }

    // ==========================================
    // FUNCIONES DE CARGA Y LECTURA DE TABLAS
    // ==========================================
    async function loadPersonal() {
      const { data, error } = await supabaseClient.from('personal').select('*');
      const tbody = document.getElementById('tablaPersonal');
      tbody.innerHTML = '';

      if (data) {
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.cedula}</td>
              <td>${item.nombre}</td>
              <td>${item.cargo}</td>
              <td><span class="badge bg-info text-dark">${item.estatus}</span></td>
            </tr>
          `;
        });
      }
    }

    async function loadPostulados() {
      const { data, error } = await supabaseClient.from('postulados').select('*');
      const tbody = document.getElementById('tablaPostulados');
      tbody.innerHTML = '';

      if (data) {
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.cedula}</td>
              <td>${item.nombre}</td>
              <td>${item.observacion || '-'}</td>
            </tr>
          `;
        });
      }
    }

    async function loadCambios() {
      const { data, error } = await supabaseClient.from('cambios_estatus').select('*');
      const tbody = document.getElementById('tablaCambios');
      tbody.innerHTML = '';

      if (data) {
        data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.cedula}</td>
              <td>${item.nuevo_estatus}</td>
              <td>${item.motivo}</td>
            </tr>
          `;
        });
      }
    }
  </script>
</body>
</html>
